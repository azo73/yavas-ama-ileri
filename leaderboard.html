<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Sıralama</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{
  background:#000;
  color:#f5c400;
  font-family:system-ui;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:100vh;
}
.box{
  background:#111;
  padding:40px;
  border-radius:20px;
  width:360px;
}
ol{padding-left:20px}
a{color:#f5c400;display:block;margin-top:15px;text-align:center}
</style>
</head>
<body>

<div class="box">
  <h2>🏆 Sıralama</h2>
  <ol id="list"></ol>
  <a href="index.html">← Pomodoro’ya dön</a>
</div>

<script>
let users = JSON.parse(localStorage.getItem("users")) || [];
users.sort((a,b)=>b.score-a.score);

users.forEach(u=>{
  const li=document.createElement("li");
  li.textContent=`${u.username} – ${u.score}`;
  list.appendChild(li);
});
</script>

</body>
</html>
