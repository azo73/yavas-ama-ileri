<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PflegeDeutsch | Hemşirelik Almancası</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #0284c7; 
            --bg-color: #f0fdfa; /* Açık medikal yeşil arka plan */
            --card-bg: #ffffff; 
            --text-dark: #0f172a; 
            --text-muted: #64748b; 
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            margin-top: 20px;
        }

        header h1 { color: var(--primary); font-size: 2rem; margin-bottom: 10px; }
        header p { color: var(--text-muted); font-size: 1.1rem; }

        /* --- FLASHCARD (DÖNEN KART) ALANI --- */
        .flashcard-container {
            width: 100%;
            max-width: 400px;
            height: 250px;
            perspective: 1000px; /* 3D efekti için derinlik */
            cursor: pointer;
            margin-bottom: 30px;
        }

        .flashcard {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.6s;
            transform-style: preserve-3d; /* Kartın iki yüzü olmasını sağlar */
        }

        /* JavaScript bu sınıfı ekleyince kart dönecek */
        .flashcard.is-flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden; /* Arka yüzü gizler */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            padding: 30px;
            text-align: center;
        }

        .card-front {
            background-color: var(--card-bg);
            border: 2px solid #e2e8f0;
        }

        .card-back {
            background-color: var(--primary);
            color: white;
            transform: rotateY(180deg); /* Arka yüz başlangıçta ters durur */
        }

        .word-german { font-size: 2rem; font-weight: 700; color: var(--text-dark); margin-bottom: 10px; }
        .word-type { font-size: 0.9rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; }
        
        .word-turkish { font-size: 1.8rem; font-weight: 700; margin-bottom: 15px; }
        .example-sentence { font-size: 1rem; font-style: italic; opacity: 0.9; }

        /* --- KONTROL BUTONLARI --- */
        .controls {
            display: flex;
            gap: 20px;
        }

        button {
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            background-color: white;
            color: var(--primary);
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover {
            background-color: var(--primary);
            color: white;
        }
        
        .instruction {
            margin-top: 30px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>PflegeDeutsch</h1>
        <p>Hemşireler İçin Tıbbi Almanca Kartları</p>
    </header>

    <div class="flashcard-container" onclick="flipCard()">
        <div class="flashcard" id="myCard">
            
            <div class="card-face card-front">
                <div class="word-type" id="wordType">Das Nomen</div>
                <div class="word-german" id="germanWord">Blutdruckmessgerät</div>
            </div>

            <div class="card-face card-back">
                <div class="word-turkish" id="turkishWord">Tansiyon Aleti</div>
                <div class="example-sentence" id="exampleSentence">"Ich brauche das Blutdruckmessgerät."</div>
            </div>

        </div>
    </div>

    <div class="controls">
        <button onclick="prevWord()">&larr; Önceki</button>
        <button onclick="nextWord()">Sonraki &rarr;</button>
    </div>

    <p class="instruction">💡 Anlamını görmek için kartın üzerine dokunun.</p>

    <script>
        // Kelime Havuzumuz (Veritabanı)
        const vocabulary = [
            {
                german: "Blutdruckmessgerät",
                type: "Das Nomen (İsim)",
                turkish: "Tansiyon Aleti",
                example: "Ich brauche das Blutdruckmessgerät. (Tansiyon aletine ihtiyacım var.)"
            },
            {
                german: "Spritze",
                type: "Die Nomen (İsim)",
                turkish: "Şırınga / İğne",
                example: "Wir müssen eine Spritze geben. (Bir iğne yapmalıyız.)"
            },
            {
                german: "Schmerzmittel",
                type: "Das Nomen (İsim)",
                turkish: "Ağrı Kesici",
                example: "Hat der Patient seine Schmerzmittel bekommen? (Hasta ağrı kesicilerini aldı mı?)"
            },
            {
                german: "Blut abnehmen",
                type: "Das Verb (Fiil)",
                turkish: "Kan almak",
                example: "Ich werde Ihnen jetzt etwas Blut abnehmen. (Şimdi sizden biraz kan alacağım.)"
            }
        ];

        let currentIndex = 0;

        // Kartı döndüren fonksiyon
        function flipCard() {
            document.getElementById("myCard").classList.toggle("is-flipped");
        }

        // Ekrandaki yazıları güncelleyen fonksiyon
        function updateCard() {
            // Kartı yeni kelimeye geçerken düzelt
            document.getElementById("myCard").classList.remove("is-flipped");
            
            // 300ms bekle (dönme animasyonu bitsin diye), sonra yazıları değiştir
            setTimeout(() => {
                document.getElementById("germanWord").innerText = vocabulary[currentIndex].german;
                document.getElementById("wordType").innerText = vocabulary[currentIndex].type;
                document.getElementById("turkishWord").innerText = vocabulary[currentIndex].turkish;
                document.getElementById("exampleSentence").innerText = vocabulary[currentIndex].example;
            }, 200);
        }

        // Sonraki kelimeye geç
        function nextWord() {
            currentIndex++;
            if (currentIndex >= vocabulary.length) {
                currentIndex = 0; // Sona gelirse başa dön
            }
            updateCard();
        }

        // Önceki kelimeye dön
        function prevWord() {
            currentIndex--;
            if (currentIndex < 0) {
                currentIndex = vocabulary.length - 1; // Başta isek en sona git
            }
            updateCard();
        }
    </script>

</body>
</html>
