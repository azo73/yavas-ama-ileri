<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Giriş / Kayıt</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{
  background:#000;
  color:#f5c400;
  font-family:system-ui;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:100vh;
}
.box{
  background:#111;
  padding:40px;
  border-radius:20px;
  width:320px;
}
input,button{
  width:100%;
  margin-top:12px;
  padding:12px;
  border:none;
  border-radius:10px;
}
input{background:#222;color:#f5c400}
button{background:#f5c400;color:#000;font-weight:700}
a{color:#f5c400;display:block;margin-top:15px;text-align:center}
</style>
</head>
<body>

<div class="box">
  <h2>Giriş / Kayıt</h2>
  <input id="username" placeholder="Kullanıcı adı">
  <input id="password" type="password" placeholder="Şifre">
  <button id="loginBtn">Giriş Yap</button>
  <button id="registerBtn">Kayıt Ol</button>
  <a href="index.html">← Pomodoro’ya dön</a>
</div>

<script>
let users = JSON.parse(localStorage.getItem("users")) || [];

loginBtn.onclick=()=>{
  const u=username.value.trim();
  const p=password.value.trim();
  const user=users.find(x=>x.username===u && x.password===p);
  if(!user) return alert("Hatalı giriş");
  localStorage.setItem("currentUser",u);
  location.href="index.html";
};

registerBtn.onclick=()=>{
  const u=username.value.trim();
  const p=password.value.trim();
  if(!u||!p) return alert("Boş bırakma");
  if(users.find(x=>x.username===u)) return alert("Kullanıcı var");
  users.push({username:u,password:p,score:0});
  localStorage.setItem("users",JSON.stringify(users));
  alert("Kayıt başarılı");
};
</script>

</body>
</html>
